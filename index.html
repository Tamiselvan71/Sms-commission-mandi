<script>
function grades(){
return {
SMS:n($("gSMS").value),
MIX:n($("gMIX").value),
SMALL:n($("gSMALL").value),
EXTRA1:n($("gE1").value),
EXTRA2:n($("gE2").value)
};
}

function setGrades(g={}){
$("gSMS").value=n(g.SMS);
$("gMIX").value=n(g.MIX);
$("gSMALL").value=n(g.SMALL);
$("gE1").value=n(g.EXTRA1);
$("gE2").value=n(g.EXTRA2);
}

function calcBill(){
let rows=document.querySelectorAll("#vegRows .billrow");
let current=0;

rows.forEach(r=>{
let q=n(r.querySelector(".vqty").value);
let rate=n(r.querySelector(".vrate").value);
let amount=q*rate;
r.querySelector(".vamount").value=amount;
current+=amount;
});

let prev=n($("previousBalance").value);
let received=n($("billReceived").value);
let total=prev+current;
let out=Math.max(total-received,0);

$("sPrev").textContent=money(prev);
$("sCurrent").textContent=money(current);
$("sTotal").textContent=money(total);
$("sOut").textContent=money(out);
}

function newBill(){
$("billCustomer").value="";
$("billDate").value=today();
$("billNo").value="";
$("previousBalance").value=0;
$("billReceived").value=0;
$("billMode").value="Cash";
$("billEdit").value="";
$("vegRows").innerHTML="";
setGrades({});
addVeg();
calcBill();
}

function saveBill(){
let cid=$("billCustomer").value;

if(!cid)return toast("Select customer");

let vegetables=getVeg();

if(!vegetables.length)return toast("Add vegetable");

let current=vegetables.reduce((a,x)=>a+n(x.amount),0);
let previous=n($("previousBalance").value);
let total=previous+current;
let received=n($("billReceived").value);

if(received>total){
return toast("Received amount cannot be more than total");
}

let data={
customerId:cid,
date:$("billDate").value||today(),
billNo:$("billNo").value.trim(),
previousBalance:previous,
vegetables,
total:current,
paymentAmount:received,
paymentMode:$("billMode").value,
grades:grades(),
createdAt:new Date().toISOString()
};

let edit=$("billEdit").value;

if(edit){
let old=db.bills.find(x=>x.id===edit);
if(old)Object.assign(old,data);
toast("Bill updated");
}else{
db.bills.unshift({id:uid(),...data});
toast("Bill saved");
}

save();
newBill();
refresh();
}

function calcPurchase(){
let amount=n($("pQty").value)*n($("pRate").value);
let previous=n($("pPrevious").value);
let paid=n($("pPaid").value);
let total=previous+amount;
let balance=Math.max(total-paid,0);

$("pAmount").value=amount;
$("pPrevShow").textContent=money(previous);
$("pCurrentShow").textContent=money(amount);
$("pTotalShow").textContent=money(total);
$("pBalanceShow").textContent=money(balance);
}

function newPurchase(){
["pParty","pBillNo","pProduct","pQty","pRate","pAmount","pPaid","pNote","pEdit"].forEach(x=>{
if($(x))$(x).value="";
});
$("pDate").value=today();
$("pProduct").value="Tomato";
$("pUnit").value="Box";
$("pMode").value="Cash";
$("pPrevious").value=0;
$("pPaid").value=0;
calcPurchase();
}

function savePurchase(){
let party=$("pParty").value;
if(!party)return toast("Select purchase party");

let qty=n($("pQty").value);
let rate=n($("pRate").value);
let amount=qty*rate;
let paid=n($("pPaid").value);

if(amount<=0)return toast("Enter purchase amount");
if(paid>n($("pPrevious").value)+amount){
return toast("Paid amount is too high");
}

let data={
partyId:party,
date:$("pDate").value||today(),
billNo:$("pBillNo").value.trim(),
previous:n($("pPrevious").value),
product:$("pProduct").value.trim(),
qty,
unit:$("pUnit").value,
rate,
amount,
paid,
paymentMode:$("pMode").value,
note:$("pNote").value.trim(),
createdAt:new Date().toISOString()
};

let edit=$("pEdit").value;

if(edit){
let old=db.purchases.find(x=>x.id===edit);
if(old)Object.assign(old,data);
toast("Purchase updated");
}else{
db.purchases.unshift({id:uid(),...data});
toast("Purchase saved");
}

save();
newPurchase();
refresh();
}

function savePartyPayment(){
let party=$("payParty").value;
let amount=n($("payAmount").value);

if(!party)return toast("Select party");
if(amount<=0)return toast("Enter amount");

db.partyPayments.unshift({
id:uid(),
partyId:party,
date:$("payDate").value||today(),
amount,
paymentMode:$("payMode").value,
note:$("payNote").value.trim(),
createdAt:new Date().toISOString()
});

save();

$("payAmount").value="";
$("payNote").value="";

refresh();
toast("Party payment saved");
}

function saveReceipt(){
let cid=$("rCustomer").value;
let amount=n($("rAmount").value);

if(!cid)return toast("Select customer");
if(amount<=0)return toast("Enter amount");

let data={
customerId:cid,
date:$("rDate").value||today(),
amount,
mode:$("rMode").value,
note:$("rNote").value.trim()
};

let edit=$("rEdit").value;

if(edit){
let r=db.receipts.find(x=>x.id===edit);
if(r)Object.assign(r,data);
toast("Receipt updated");
}else{
db.receipts.unshift({id:uid(),...data});
toast("Receipt saved");
}

save();
clearReceipt();
refresh();
}

db.receipts=db.receipts.filter(x=>x.id!==i);

function editBill(i){

db.bills=db.bills.filter(x=>x.id!==i);

function gradeTotals(cid){
let result={
SMS:{issued:0,received:0},
MIX:{issued:0,received:0},
SMALL:{issued:0,received:0},
EXTRA1:{issued:0,received:0},
EXTRA2:{issued:0,received:0}
};

db.bills
.filter(b=>b.customerId===cid)
.forEach(b=>{
let g=b.grades||{};
Object.keys(result).forEach(k=>{
result[k].issued+=n(g[k]);
});
});

return result;
}

function downloadHistoryPDF(cid){
let c=customer(cid);
if(!c)return;

const jsPDF=window.jspdf?.jsPDF;

if(!jsPDF){
return toast("PDF library loading. Try again");
}

let doc=new jsPDF({
orientation:"landscape",
unit:"mm",
format:"a4"
});

let a=account(cid);
let gt=gradeTotals(cid);

doc.setFontSize(18);
doc.text("SMS COMMISSION MANDI",14,15);

doc.setFontSize(13);
doc.text("Customer Full History",14,23);

doc.setFontSize(10);
doc.text(`Customer: ${c.name}`,14,31);
doc.text(`Phone: ${c.phone||"-"}`,14,37);
doc.text(`Address: ${c.address||"-"}`,14,43);

doc.text(`Opening: ${money(a.opening)}`,150,31);
doc.text(`Sales: ${money(a.sales)}`,150,37);
doc.text(`Received: ${money(a.received)}`,150,43);
doc.text(`Balance: ${money(a.outstanding)}`,150,49);

let gradeRows=Object.keys(gt).map(k=>[
k==="EXTRA1"?"EXTRA 1":k==="EXTRA2"?"EXTRA 2":k,
gt[k].issued,
gt[k].received,
gt[k].issued-gt[k].received
]);

doc.setFontSize(12);
doc.text("Grade / Crate Summary",14,58);

doc.autoTable({
startY:62,
head:[["Grade","Issued","Received","Balance"]],
body:gradeRows,
theme:"grid",
styles:{fontSize:9}
});

let y=doc.lastAutoTable.finalY+8;

doc.setFontSize(12);
doc.text("Sales Bills",14,y);

let rows=[...a.bills]
.sort((x,y)=>String(x.date).localeCompare(String(y.date)))
.map(b=>{
let veg=(b.vegetables||[])
.map(v=>`${v.name} ${v.qty} x ${v.rate}`)
.join(", ");

let g=b.grades||{};

return [
b.date||"",
b.billNo||"-",
veg,
money(b.total),
money(b.paymentAmount),
`SMS:${n(g.SMS)} MIX:${n(g.MIX)} SMALL:${n(g.SMALL)} EX1:${n(g.EXTRA1)} EX2:${n(g.EXTRA2)}`
];
});

doc.autoTable({
startY:y+4,
head:[[
"Date",
"Bill",
"Vegetables",
"Bill Amount",
"Received",
"Grades"
]],
body:rows,
theme:"grid",
styles:{fontSize:7},
headStyles:{fontSize:7}
});

y=doc.lastAutoTable.finalY+8;

if(y>180){
doc.addPage();
y=15;
}

doc.setFontSize(12);
doc.text("Receipt History",14,y);

let receiptRows=a.receipts.map(r=>[
r.date||"",
money(r.amount),
r.mode||"",
r.note||""
]);

doc.autoTable({
startY:y+4,
head:[["Date","Amount","Mode","Note"]],
body:receiptRows,
theme:"grid",
styles:{fontSize:8}
});

doc.save(
"SMS_Customer_History_"+c.name.replace(/[^a-z0-9]/gi,"_")+".pdf"
);

toast("Customer PDF downloaded");
}

}

.filter(x=>x.partyId===p.id)
.reduce((a,x)=>a+n(x.amount),0);

let purchasePaid=db.purchases
.filter(x=>x.partyId===p.id)
.reduce((a,x)=>a+n(x.paid),0);

let partyPaid=db.partyPayments
.filter(x=>x.partyId===p.id)
.reduce((a,x)=>a+n(x.amount),0);

return total+n(p.openingBalance)+purchaseAmount-purchasePaid-partyPaid;
},0);

$("dCustomers").textContent=salesCustomers().length;
$("dWeekly").textContent=
salesCustomers().filter(x=>x.type==="Weekly").length;
$("dParties").textContent=parties().length;
$("dSales").textContent=money(sales);
$("dPurchase").textContent=money(purchase);
$("dOut").textContent=money(out);
$("dPayable").textContent=money(payable);
$("dBills").textContent=db.bills.length;

let weekly=salesCustomers()
.filter(x=>x.type==="Weekly")
.map(c=>{
let a=account(c.id);
return `
<div class="customer">
<div class="section-title">
<b>${esc(c.name)}</b>
<strong>${money(a.outstanding)}</strong>
</div>
<div class="muted">
Bills: ${a.bills.length}
•
Received: ${money(a.received)}
</div>
</div>
`;
}).join("");

$("weeklyBox").innerHTML=
weekly||'<div class="empty">No weekly customers</div>';

showPartyBalances();
}

function backup(){
let blob=new Blob(
[JSON.stringify(db,null,2)],
{type:"application/json"}
);

let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=
"SMS_COMMISSION_MANDI_BACKUP_"+today()+".json";
a.click();

toast("Backup downloaded");
}

function restore(e){
let file=e.target.files[0];
if(!file)return;

let reader=new FileReader();

reader.onload=function(){
try{
let x=JSON.parse(reader.result);

if(!x.customers||!x.bills){
throw new Error();
}

db=x;

save();
refresh();

toast("Backup restored");
}catch(err){
toast("Invalid backup file");
}
};

reader.readAsText(file);
}

function deleteAll(){
if(!confirm("WARNING: Delete ALL data?"))return;

if(!confirm("Are you absolutely sure?"))return;

localStorage.removeItem(KEY);

db={
customers:[],
bills:[],
receipts:[],
purchases:[],
partyPayments:[],
billSettings:{
header:"SMS COMMISSION MANDI",
subHeader:"Customer Accounts & Billing",
contact:"",
footer:"Thank You"
}
};

refresh();
toast("All data deleted");
}

function saveSettings(){
db.billSettings.header=$("setHeader").value;
db.billSettings.subHeader=$("setSub").value;
db.billSettings.contact=$("setContact").value;
db.billSettings.footer=$("setFooter").value;

save();
toast("Settings saved");
}

function saveApi(){
let url=$("apiUrl").value.trim();
localStorage.setItem("SMS_API_URL",url);
toast("Cloud URL saved");
}

async function cloudPush(){
let url=$("apiUrl").value.trim();

if(!url){
return toast("Enter Google Apps Script URL");
}

try{
toast("Uploading...");

let response=await fetch(url,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify(db)
});

let text=await response.text();

toast("Cloud upload complete");
console.log(text);

}catch(e){
console.error(e);
toast("Cloud upload failed");
}
}

async function cloudPull(){
let url=$("apiUrl").value.trim();

if(!url){
return toast("Enter Google Apps Script URL");
}

try{
toast("Downloading...");

let response=await fetch(url,{
method:"GET"
});

let x=await response.json();

if(!x.customers||!x.bills){
return toast("Invalid cloud data");
}

db=x;

save();
refresh();

toast("Cloud data loaded");

}catch(e){
console.error(e);
toast("Cloud download failed");
}
}


/* =====================================================
   VEHICLE RENT
===================================================== */

if(!db.vehicleRents){
db.vehicleRents=[];
}

function vehicleRentPage(){
document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

$("vehicleRent").classList.add("active");

document.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

let btn=[...document.querySelectorAll(".nav button")]
.find(x=>x.textContent.includes("Vehicle"));

if(btn)btn.classList.add("active");

renderVehicleRents();
}

function vehicleRentAmount(){
let rent=n($("vrRent").value);
let paid=n($("vrPaid").value);
let balance=Math.max(rent-paid,0);

$("vrTotal").textContent=money(rent);
$("vrPaidShow").textContent=money(paid);
$("vrBalance").textContent=money(balance);
}

function saveVehicleRent(editId=""){
let data={
date:$("vrDate").value||today(),
vehicle:$("vrVehicle").value.trim(),
driver:$("vrDriver").value.trim(),
driverPhone:$("vrDriverPhone").value.trim(),
from:$("vrFrom").value.trim(),
to:$("vrTo").value.trim(),
purpose:$("vrPurpose").value.trim(),
rent:n($("vrRent").value),
paid:n($("vrPaid").value),
mode:$("vrMode").value,
note:$("vrNote").value.trim()
};

if(!data.vehicle&&!data.driver)
return toast("Vehicle or Driver enter pannunga");

if(data.rent<=0)
return toast("Rent amount enter pannunga");

if(data.paid>data.rent)
return toast("Paid amount rent-ஐ விட அதிகமாக இருக்கக்கூடாது");

data.balance=data.rent-data.paid;

if(editId){
let x=db.vehicleRents.find(x=>x.id===editId);
if(x)Object.assign(x,data);
toast("Vehicle Rent updated");
}else{
db.vehicleRents.unshift({
id:uid(),
...data
});
toast("Vehicle Rent saved");
}

save();
clearVehicleRent();
renderVehicleRents();
}

function clearVehicleRent(){
$("vrDate").value=today();
$("vrVehicle").value="";
$("vrDriver").value="";
$("vrDriverPhone").value="";
$("vrFrom").value="";
$("vrTo").value="";
$("vrPurpose").value="";
$("vrRent").value="";
$("vrPaid").value="";
$("vrMode").value="Cash";
$("vrNote").value="";
$("vrEdit").value="";
vehicleRentAmount();

$("vrSaveBtn").textContent="Save Vehicle Rent";
$("vrSaveBtn").onclick=function(){
saveVehicleRent();
};
}

function editVehicleRent(i){
let x=db.vehicleRents.find(x=>x.id===i);
if(!x)return;

$("vrDate").value=x.date||today();
$("vrVehicle").value=x.vehicle||"";
$("vrDriver").value=x.driver||"";
$("vrDriverPhone").value=x.driverPhone||"";
$("vrFrom").value=x.from||"";
$("vrTo").value=x.to||"";
$("vrPurpose").value=x.purpose||"";
$("vrRent").value=x.rent||0;
$("vrPaid").value=x.paid||0;
$("vrMode").value=x.mode||"Cash";
$("vrNote").value=x.note||"";
$("vrEdit").value=i;

vehicleRentAmount();

$("vrSaveBtn").textContent="Update Vehicle Rent";
$("vrSaveBtn").onclick=function(){
saveVehicleRent(i);
};

vehicleRentPage();
window.scrollTo({top:0,behavior:"smooth"});
}

function deleteVehicleRent(i){
if(!confirm("Delete this vehicle rent?"))return;

db.vehicleRents=db.vehicleRents.filter(x=>x.id!==i);

save();
renderVehicleRents();

toast("Vehicle rent deleted");
}

function renderVehicleRents(){
let search=($("vrSearch")?.value||"").toLowerCase();
let date=$("vrFilterDate")?.value||"";

let rows=db.vehicleRents.filter(x=>{
let text=[
x.vehicle,
x.driver,
x.driverPhone,
x.from,
x.to,
x.purpose,
x.note
].join(" ").toLowerCase();

return (!search||text.includes(search))&&
(!date||x.date===date);
});

let rent=rows.reduce((a,x)=>a+n(x.rent),0);
let paid=rows.reduce((a,x)=>a+n(x.paid),0);
let balance=rows.reduce((a,x)=>a+n(x.balance),0);

$("vrSummary").innerHTML=`
<div class="grid4">
<div class="stat">
<small>Total Trips</small>
<strong>${rows.length}</strong>
</div>
<div class="stat">
<small>Total Rent</small>
<strong>${money(rent)}</strong>
</div>
<div class="stat">
<small>Total Paid</small>
<strong>${money(paid)}</strong>
</div>
<div class="stat">
<small>Total Balance</small>
<strong>${money(balance)}</strong>
</div>
</div>
`;

$("vrTable").innerHTML=rows.length?
rows.map(x=>`
<tr>
<td>${esc(x.date)}</td>
<td><b>${esc(x.vehicle)}</b></td>
<td>
<b>${esc(x.driver)}</b>
<br>
<small>${esc(x.driverPhone||"")}</small>
</td>
<td>${esc(x.from||"-")}</td>
<td>${esc(x.to||"-")}</td>
<td>${esc(x.purpose||"-")}</td>
<td>${money(x.rent)}</td>
<td>${money(x.paid)}<br><small>${esc(x.mode)}</small></td>
<td><b>${money(x.balance)}</b></td>
<td>
<button class="btn small gray"
onclick="editVehicleRent('${x.id}')">
Edit
</button>
<button class="btn small red"
onclick="deleteVehicleRent('${x.id}')">
Delete
</button>
</td>
</tr>
`).join("")
:
`<tr><td colspan="10" class="empty">No Vehicle Rent Records</td></tr>`;
}

   STARTUP
===================================================== */

function init(){
load();

$("billDate").value=today();
$("pDate").value=today();
$("payDate").value=today();
$("rDate").value=today();

$("setHeader").value=db.billSettings.header||"";
$("setSub").value=db.billSettings.subHeader||"";
$("setContact").value=db.billSettings.contact||"";
$("setFooter").value=db.billSettings.footer||"";

$("vegRows").innerHTML="";
addVeg();

refresh();
}

init();
</script>
